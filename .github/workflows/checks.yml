# Core + fake-backend tests and a syntax check on every push/PR.
name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/test-core.mjs
      - run: for f in js/*.js sw.js; do node --check "$f"; done
      - run: node -e "JSON.parse(require('fs').readFileSync('data/plans.json'))" && node -e "JSON.parse(require('fs').readFileSync('data/places.json'))" && node -e "JSON.parse(require('fs').readFileSync('data/questions.json'))"
